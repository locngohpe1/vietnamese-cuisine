<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Spin 3D Vietnamese dishes, guess their names and find the ingredients. A mini game for a Vietnamese culture talk.">
<meta name="theme-color" content="#4a0d0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238d1d16'/%3E%3Cpath d='M10 28h44a22 22 0 0 1-44 0z' fill='%23f6ead0'/%3E%3Cpath d='M12 28h40' stroke='%23f3b431' stroke-width='5'/%3E%3C/svg%3E">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Taste Vietnam 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Bungee&display=swap">
<style>
/* Layout: one-screen street-stall game. Ticket bar on top, a 3D wooden cutting board in the middle,
   a rice-paper answer card docked at the bottom. One deliberate look (lacquer-red stall, like the talk's slides), no theme switch. */
:root{
  --lacquer:#8d1d16;
  --lacquer-deep:#4a0d0a;
  --lacquer-glow:#b9381f;
  --paper:#f6ead0;
  --paper-edge:#e3cfa6;
  --card:#fffaf0;
  --ink:#2a190f;
  --ink-soft:#6a4f3d;
  --turmeric:#f3b431;
  --turmeric-deep:#a8730c;
  --herb:#2d7745;
  --herb-wash:#e1efdc;
  --chili:#c2331d;
  --chili-wash:#f7dfd8;
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Be Vietnam Pro","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--lacquer-deep);color:var(--paper);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);background:var(--paper);z-index:5}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(130% 75% at 50% 42%,var(--lacquer-glow) 0%,var(--lacquer) 42%,var(--lacquer-deep) 100%)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-size:16px;line-height:1;color:var(--turmeric);white-space:nowrap}
.brand small{display:block;margin-top:4px;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--paper);opacity:.75}
.right{display:flex;align-items:center;gap:6px;min-width:0}
.stats{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:baseline;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.22);border:1px solid rgba(246,234,208,.22);font-size:13px;font-weight:700;color:var(--paper);white-space:nowrap}
.pill i{font-style:normal;font-weight:600;opacity:.7;font-size:10px;letter-spacing:.08em;text-transform:uppercase}

#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;padding:7px 11px;border-radius:12px;background:var(--card);color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:12px;line-height:1.3;white-space:nowrap;will-change:transform}
.tag b{display:block;font-size:14px}
.tag span{color:var(--ink-soft)}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:11px;height:11px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tag.ok{background:var(--herb);color:var(--card)}
.tag.miss{background:var(--chili);color:var(--card)}
.tag.ok span,.tag.miss span{color:var(--paper)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.32);color:var(--paper);font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap;pointer-events:none;transition:opacity .5s}
.hint.gone{opacity:0}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:8px 14px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.35);white-space:nowrap}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--paper);font-weight:600}

.panel{position:relative;z-index:2;flex:0 0 auto;max-height:62%;overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.28);padding-block:16px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.eyebrow{margin:0;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--turmeric-deep)}
.title{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,42px);line-height:.95;color:var(--lacquer);text-wrap:balance}
.title span{color:var(--turmeric-deep)}
.lede{margin:0;line-height:1.45;max-width:46ch}
.zh{display:block;color:var(--ink-soft);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{background:var(--card);border:1px solid var(--paper-edge);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.chips b{font-family:var(--display);font-weight:400;color:var(--lacquer);margin-right:3px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft)}
.field input{font:inherit;font-size:16px;font-weight:500;letter-spacing:0;color:var(--ink);background:var(--card);border:2px solid var(--paper-edge);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}
.q{margin:0;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;text-wrap:balance}
.q mark{background:var(--turmeric);color:var(--ink);padding:0 6px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{margin:3px 0 0;font-size:14px;font-weight:600;color:var(--ink-soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;border:2px solid var(--paper-edge);background:var(--card);color:var(--ink);border-radius:14px;padding:9px 12px;min-height:60px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.opt b{font-size:17px;font-weight:800}
.opt span{font-size:12px;line-height:1.25;color:var(--ink-soft)}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--herb);background:var(--herb-wash)}
.opt.wrong{border-color:var(--chili);background:var(--chili-wash)}
.opt:disabled{cursor:default}
.btn{font-family:var(--display);font-size:16px;font-weight:400;background:var(--turmeric);color:var(--ink);border:0;border-radius:14px;padding:14px 18px;box-shadow:0 3px 0 var(--turmeric-deep);cursor:pointer;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--turmeric-deep)}
.link{background:none;border:0;padding:8px 2px;color:var(--ink-soft);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.actions{display:flex;flex-direction:column;gap:4px}
.verdict{align-self:flex-start;font-family:var(--display);font-size:14px;padding:6px 12px;border-radius:999px;color:var(--card)}
.verdict.ok{background:var(--herb)}
.verdict.no{background:var(--chili)}
.dish b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1;color:var(--lacquer)}
.dish span{display:block;margin-top:5px;font-weight:600;color:var(--ink-soft)}
.dish.sm b{font-size:24px}
.fact{margin:0;line-height:1.5;max-width:60ch}
.tries{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.tries .d{width:12px;height:12px;border-radius:50%;background:var(--turmeric);box-shadow:inset 0 -2px 0 var(--turmeric-deep)}
.tries .d.used{background:var(--paper-edge);box-shadow:none}
.msg{font-size:13px;font-weight:600;color:var(--ink-soft)}
.msg.bad{color:var(--chili)}
.results{align-items:flex-end}
.score{font-family:var(--display);font-size:64px;line-height:.85;color:var(--lacquer);font-variant-numeric:tabular-nums}
.score small{font-size:18px;color:var(--ink-soft)}
.rank{display:flex;flex-direction:column;gap:2px;text-align:left}
.rank b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.rank span{font-weight:600;color:var(--ink-soft);font-size:13px;font-variant-numeric:tabular-nums}
.recap{display:grid;gap:6px}
.recap div{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--paper-edge);border-radius:10px;padding:8px 12px;font-size:14px}
.recap div b{font-weight:800}
.recap div span{color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums}
.thanks{margin:0;background:var(--lacquer);color:var(--paper);border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.4}
.thanks span{display:block;font-weight:500;font-size:13px;opacity:.85}
.dchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dchip{font-weight:800;font-size:14px;border:2px solid var(--paper-edge);background:var(--card);border-radius:12px;padding:10px 4px;cursor:pointer;color:var(--ink)}
.dchip[aria-pressed="true"]{border-color:var(--lacquer);background:var(--lacquer);color:var(--paper)}
@media (max-width:380px){.dchips{grid-template-columns:repeat(2,1fr)}.q{font-size:19px}.opt b{font-size:16px}}

@media (prefers-reduced-motion:reduce){.hint,.opt{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">Taste Vietnam 3D<small>越南美食 3D 小遊戲</small></div>
    <div class="right"><div class="stats" id="stats"></div></div>
  </header>
  <main id="stage">
    <canvas id="c" aria-label="3D view of a Vietnamese dish. Drag to turn it, tap to pick an ingredient."></canvas>
    <div id="labels"></div>
    <div class="hint" id="hint">Drag to spin · Pinch to zoom</div>
    <div class="toast" id="toast" hidden></div>
    <div class="nogl" id="nogl" hidden>This phone's browser can't show 3D. You can still answer the name questions.</div>
  </main>
  <section class="panel" id="panel" aria-live="polite"><div class="inner" id="inner"></div></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

function limeTex(){const[c,x]=cnv(256,256);const R=rng(6);x.fillStyle="#4d8a26";x.fillRect(0,0,256,256);const C=128;

/* ---------- 3D: scene, loop, input ---------- */
function init3D(){canvas=$("#c");stage=$("#stage");
  try{if(!window.THREE)throw new Error("no three");renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});}
  catch(e){has3D=false;$("#nogl").hidden=false;$("#hint").hidden=true;return;}
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.setClearColor(0x000000,0);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(40,1,.1,100);
  scene.add(new THREE.HemisphereLight(0xfff0d8,0x6a2a18,.62));
  const key=new THREE.DirectionalLight(0xfff1dc,.78);key.position.set(3.5,8,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);
  const sc=key.shadow.camera;sc.left=-4.5;sc.right=4.5;sc.top=4.5;sc.bottom=-4.5;sc.near=1;sc.far=20;key.shadow.bias=-.0006;key.shadow.normalBias=.02;scene.add(key);
  const rim=new THREE.DirectionalLight(0xffb27a,.3);rim.position.set(-5,3,-4);scene.add(rim);
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener("resize",resize);
  resize();bindControls();requestAnimationFrame(frame);}
function resize(){if(!renderer)return;const r=stage.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
function showDish(id){if(!has3D)return;if(cur)scene.remove(cur.group);clearHL();hideLabel();
  let d=built[id];
  if(!d){const def=DISH[id];const group=def.build();const pk=[];group.traverse(o=>{if(o.isMesh&&o.userData.part)pk.push(o);});d=built[id]={id:id,group:group,pickables:pk,fitR:def.fitR,steam:group.userData.steam||null};}
  cur=d;cur.pop=reduceMotion?1:0;cur.group.scale.setScalar(reduceMotion?1:.001);scene.add(cur.group);pickables=cur.pickables;zoom=1;yawVel=0;}
function fitDist(){const hv=THREE.MathUtils.degToRad(camera.fov/2);const hh=Math.atan(Math.tan(hv)*camera.aspect);return(cur?cur.fitR:2.8)/Math.tan(Math.min(hv,hh));}
function updateCamera(){const d=fitDist()*zoom,ty=.38;camera.position.set(0,ty+d*Math.sin(pitch),d*Math.cos(pitch));camera.lookAt(0,ty,0);}
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}
function spinning(){return!reduceMotion&&(G.mode!=="play"||G.phase==="guess"||G.phase==="reveal");}
let tPrev=0;
function frame(now){const dt=tPrev?Math.min(3,(now-tPrev)/16.67):1;tPrev=now;
  if(cur){
    if(!dragging){if(yawGoal!==null){const dg=yawGoal-yaw;if(Math.abs(dg)<.003){yaw=yawGoal;yawGoal=null;}else yaw+=dg*Math.min(1,.09*dt);}else if(Math.abs(yawVel)>.0002){yaw+=yawVel*dt;yawVel*=Math.pow(.9,dt);}else if(spinning()&&now-lastInteract>1600){yaw+=.0032*dt;}}
    cur.group.rotation.y=yaw;
    if(cur.pop<1){cur.pop=Math.min(1,cur.pop+.04*dt);cur.group.scale.setScalar(Math.max(.001,easeOutBack(cur.pop)));}
    if(cur.steam&&!reduceMotion)for(const s of cur.steam){const u=s.userData;const p=(now*.00012+u.ph)%1;s.position.set(u.x+Math.sin(p*6+u.ph*10)*.15,u.y0+p*1.6,u.z);const k=.6+p*1.2;s.scale.set(k,k,1);s.material.opacity=Math.sin(p*Math.PI)*.28;}
  }
  updateCamera();pulseHL(now);placeLabel();renderer.render(scene,camera);requestAnimationFrame(frame);}
function bindControls(){const ptrs=new Map();let dX=0,dY=0,dT=0,lX=0,lY=0,moved=false,p0=0,z0=1;
  const d2=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
  canvas.addEventListener("pointerdown",e=>{try{canvas.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();
    if(ptrs.size===1){dX=lX=e.clientX;dY=lY=e.clientY;dT=performance.now();moved=false;dragging=true;yawVel=0;yawGoal=null;}
    else if(ptrs.size===2){p0=d2();z0=zoom;moved=true;}});
  canvas.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});lastInteract=performance.now();
    if(ptrs.size===1){const dx=e.clientX-lX,dy=e.clientY-lY;lX=e.clientX;lY=e.clientY;
      if(!moved&&Math.abs(e.clientX-dX)+Math.abs(e.clientY-dY)>8){moved=true;fadeHint();}
      if(moved){yaw+=dx*.009;yawVel=dx*.009;pitch=Math.min(1.2,Math.max(.3,pitch+dy*.005));}}
    else if(ptrs.size===2&&p0>0){zoom=Math.min(1.5,Math.max(.5,z0*p0/d2()));}});
  canvas.addEventListener("pointerup",e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(ptrs.size===0){dragging=false;if(!moved&&performance.now()-dT<600)onTap(e.clientX,e.clientY);}
    else{const a=[...ptrs.values()][0];lX=a.x;lY=a.y;}});
  canvas.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);if(!ptrs.size)dragging=false;});
  canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.min(1.5,Math.max(.5,zoom*(1+e.deltaY*.0012)));lastInteract=performance.now();},{passive:false});}

/* picking, highlight, labels */
const ray=typeof THREE!=="undefined"?new THREE.Raycaster():null;
function pick(nx,ny){if(!cur)return null;ray.setFromCamera({x:nx,y:ny},camera);const hits=ray.intersectObjects(pickables,false);let see=null,low=null;
  const res=h=>({part:h.object.userData.part,low:!!h.object.userData.low,local:cur.group.worldToLocal(h.point.clone())});
  for(const h of hits){const u=h.object.userData;
    if(u.seeThrough){if(!see)see=h;continue;}
    if(u.low){if(!low)low=h;continue;}
    if(low&&h.distance-low.distance>.3)return res(low);
    if(see&&h.distance-see.distance>.6)return res(see);
    return res(h);}
  return see?res(see):low?res(low):null;}
let hl=null;
function setHL(part){clearHL();if(!cur)return;const mats=[];cur.group.traverse(o=>{if(o.isMesh&&o.userData.part===part&&!o.userData.proxy){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.emissive&&mats.indexOf(m)<0)mats.push(m);});}});hl={mats:mats};}
function clearHL(){if(hl){hl.mats.forEach(m=>{m.emissive.setHex(0);m.emissiveIntensity=1;});hl=null;}}
function pulseHL(now){if(!hl)return;const k=reduceMotion?.35:.3+.22*Math.sin(now*.006);hl.mats.forEach(m=>{m.emissive.setHex(0xffb627);m.emissiveIntensity=k;});}
function anchor(part){const box=new THREE.Box3();let any=false;cur.group.updateMatrixWorld(true);for(const m of cur.pickables){if(m.userData.part===part&&!m.userData.proxy){box.expandByObject(m);any=true;}}
  if(!any)return new THREE.Vector3();const c=box.getCenter(new THREE.Vector3());c.y=box.max.y;return cur.group.worldToLocal(c);}
/* turn the dish so the asked-for ingredient sits on the side facing the player */
function faceTarget(part){if(!cur)return;const a=anchor(part);if(Math.hypot(a.x,a.z)<.5)return;const goal=-Math.atan2(a.x,a.z)+.25;const d=((goal-yaw)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI;if(reduceMotion)yaw+=d;else yawGoal=yaw+d;}
const tagEl=document.createElement("div");tagEl.hidden=true;$("#labels").appendChild(tagEl);let tag=null,tagTimer=0;
function showLabel(part,local,kind){const P=PARTS[part];if(!P||!local)return;tagEl.className="tag"+(kind?" "+kind:"");tagEl.innerHTML="<b>"+esc(P.en)+"</b><span>"+esc(P.zh)+" · "+esc(P.vi)+"</span>";tagEl.hidden=false;tag={local:local.clone()};
  clearTimeout(tagTimer);if(kind==="miss"||kind==="info")tagTimer=setTimeout(hideLabel,kind==="miss"?2200:2800);placeLabel();}
function hideLabel(){tag=null;tagEl.hidden=true;}
function placeLabel(){if(!tag||!cur)return;const v=tag.local.clone();cur.group.localToWorld(v);v.project(camera);
  const w=tagEl.offsetWidth||120;let x=(v.x*.5+.5)*W,y=(-v.y*.5+.5)*H;x=Math.min(W-w/2-8,Math.max(w/2+8,x));y=Math.max(tagEl.offsetHeight+16,y);
  tagEl.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translate(-50%,calc(-100% - 10px))";}

/* ---------- taps ---------- */
function onTap(cx,cy){if(!has3D||!cur)return;const r=canvas.getBoundingClientRect();
  const P=(x,y)=>pick(((x-r.left)/r.width)*2-1,-((y-r.top)/r.height)*2+1);
  const center=P(cx,cy);
  if(G.mode==="play"&&G.phase==="find"){
    let hit=center&&center.part===G.target?center:null;
    if(!hit){for(let i=0;i<10&&!hit;i++){const a=i/10*Math.PI*2,rad=i<5?11:20;const p=P(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);if(p&&p.part===G.target)hit=p;}}
    if(hit)return findSuccess(hit);
    if(!center){toast("Tap on the food · 點食物");return;}
    if(center.low){showLabel(center.part,center.local,"info");toast("Keep looking · 再找找");return;}
    return findMiss(center);}
  if(G.mode==="play"&&G.phase==="guess")return;
  if(center)showLabel(center.part,center.local,"info");}
let toastTimer=0;

/* ---------- boot ---------- */
